<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#050607">
<title>ETHUTHAN</title>
<style>
:root{--gold:#e0aa45;--gold2:#ffd778}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050607}
body{overflow:hidden;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}
.app{position:relative;width:100%;min-height:100svh;max-width:430px;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.035),transparent 28%),radial-gradient(circle at 50% 72%,rgba(224,170,69,.07),transparent 25%),linear-gradient(180deg,#0a0d10,#050607 58%,#020304);display:flex;flex-direction:column;align-items:center;padding:max(22px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
.app:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,80,255,.035),transparent 30%,transparent 70%,rgba(255,0,0,.035)),repeating-linear-gradient(0deg,transparent 0 4px,rgba(255,255,255,.008) 5px)}
.hero{position:relative;z-index:1;width:min(86vw,350px);aspect-ratio:1;margin-top:2vh;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff 0 66%,#fff 67%,rgba(224,170,69,.9) 67.7%,rgba(255,215,120,.55) 68.5%,transparent 69.2%),conic-gradient(from 220deg,#175cff,#175cff 23%,#101318 31%,#ff251d 70%,#ff251d 82%,#101318 91%,#175cff);box-shadow:0 0 32px rgba(224,170,69,.18),0 25px 60px rgba(0,0,0,.75);animation:ringBreath 5s ease-in-out infinite}
.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(224,170,69,.8);box-shadow:0 0 18px rgba(224,170,69,.35)}
.logo{position:relative;z-index:2;width:76%;height:76%;object-fit:contain;border-radius:50%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.3))}
@keyframes ringBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
.brand{position:relative;z-index:2;margin-top:1.5vh;text-align:center;font-size:12px;font-weight:800;letter-spacing:.32em}
.socials{position:relative;z-index:2;width:100%;max-width:390px;margin-top:4.2vh;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.social{min-height:72px;border-radius:25px;border:1px solid rgba(255,255,255,.25);background:linear-gradient(135deg,rgba(15,16,18,.94),rgba(5,6,8,.96));color:#fff;text-decoration:none;display:flex;align-items:center;gap:13px;padding:10px 15px;position:relative;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.35);transition:transform .18s,border-color .18s}
.social:before{content:"";position:absolute;inset:-2px;border-radius:inherit;padding:1px;background:var(--accent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.8}
.social:active{transform:scale(.96)}
.social .icon{width:48px;height:48px;flex:0 0 48px;border-radius:15px;display:grid;place-items:center;background:#11151a;font-size:26px;font-weight:900}
.social .label{font-size:14px;font-weight:700}
.social .arrow{margin-left:auto;font-size:26px;color:#eee}
.youtube{--accent:linear-gradient(135deg,#ff2020,#ff3b00)}.facebook{--accent:linear-gradient(135deg,#087cff,#2563eb)}.instagram{--accent:linear-gradient(135deg,#ffb000,#ff1768,#7138ff)}.tiktok{--accent:linear-gradient(135deg,#25f4ee,#fe2c55)}
.youtube .icon{background:#f00}.facebook .icon{background:#1877f2}.instagram .icon{background:linear-gradient(135deg,#ffb000,#ff006a,#7138ff)}.tiktok .icon{background:#050505;text-shadow:-2px 0 #25f4ee,2px 0 #fe2c55}
.divider{position:relative;z-index:2;width:86%;margin-top:4.8vh;display:flex;align-items:center;gap:10px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#d9a847)}.divider:after{background:linear-gradient(90deg,#d9a847,transparent)}
.diamond{width:10px;height:10px;transform:rotate(45deg);border:1px solid var(--gold2);box-shadow:0 0 12px rgba(255,215,120,.25)}
.tagline{position:relative;z-index:2;margin-top:13px;color:#e8e8e8;font-size:10px;letter-spacing:.34em;text-align:center;white-space:nowrap}
.divider.bottom{margin-top:13px}.credit{position:relative;z-index:2;margin-top:auto;padding-top:14px;color:#777;font-size:7px;letter-spacing:.22em}
@media(max-height:700px){.hero{width:min(72vw,285px);margin-top:0}.socials{margin-top:2.5vh}.social{min-height:60px}.social .icon{width:40px;height:40px;flex-basis:40px}.divider{margin-top:2.5vh}}
@media(prefers-reduced-motion:reduce){.ring{animation:none}.social{transition:none}}
</style>
</head>
<body>
<main class="app">
<section class="hero"><div class="ring"></div><img class="logo" src="assets/ethuthan-logo.png" alt="ETHUTHAN logo"></section>
<div class="brand">ETHUTHAN</div>
<nav class="socials" aria-label="ETHUTHAN social platforms">
<a class="social youtube" href="https://youtube.com/@ethuthan" target="_blank" rel="noopener"><span class="icon">▶</span><span class="label">YouTube</span><span class="arrow">›</span></a>
<a class="social facebook" href="https://www.facebook.com/ourlanguage.ourpresence/" target="_blank" rel="noopener"><span class="icon">f</span><span class="label">Facebook</span><span class="arrow">›</span></a>
<a class="social instagram" href="https://www.instagram.com/ethuthan" target="_blank" rel="noopener"><span class="icon">◎</span><span class="label">Instagram</span><span class="arrow">›</span></a>
<a class="social tiktok" href="https://www.tiktok.com/@ethuthan" target="_blank" rel="noopener"><span class="icon">♪</span><span class="label">TikTok</span><span class="arrow">›</span></a>
</nav>
<div class="divider"><i class="diamond"></i></div>
<div class="tagline">OUR LANGUAGE • OUR PRESENCE</div>
<div class="divider bottom"><i class="diamond"></i></div>
<div class="credit">ETHUTHAN</div>
</main>
</body>
</html>
